name: Publish to PyPI

# Creating (publishing) a GitHub release builds the package and uploads it to
# PyPI. The release tag must match the package version, e.g. `v0.1.0` or
# `0.1.0` for `__version__ = "0.1.0"`.
#
# Authentication uses PyPI Trusted Publishing (OIDC), so no API token is
# stored in the repository. One-time setup on https://pypi.org:
#   Account settings > Publishing > Add a new pending publisher
#     PyPI project name: starlette-admin-infinite-scroll
#     Owner:             Alwinator
#     Repository name:   starlette-admin-infinite-scroll
#     Workflow name:     publish.yml
#     Environment name:  pypi
# and create a `pypi` environment under GitHub repo Settings > Environments
# (optionally with required reviewers).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Check release tag matches package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/starlette_admin_infinite_scroll/__init__.py)
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match package version '$VERSION'"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Smoke test the wheel
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c \
            "from starlette_admin_infinite_scroll import InfiniteScrollPlugin; InfiniteScrollPlugin()"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/starlette-admin-infinite-scroll/
    permissions:
      id-token: write # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  attach-to-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Upload dist files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --repo "${{ github.repository }}" --clobber
